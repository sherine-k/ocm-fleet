name: Diagnose Kind provisioning

on:
  push:
    branches: [debug/e2e-kind-provisioning]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: instances-only-26
            os: ubuntu-26.04
            inotify: true
    steps:
      - uses: actions/checkout@v7

      - name: Inspect host before setup
        run: |
          uname -a
          podman version
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches kernel.keys.maxkeys kernel.keys.maxbytes
          ls -l /etc/sysctl.conf /etc/sysctl.d/ || true
          cat /etc/sysctl.conf || true
          free -m
          df -h /

      - uses: ./.github/actions/setup-e2e
        with:
          role: e2e

      - name: Inspect Podman and raise inotify for experiment
        env:
          RAISE_INOTIFY: ${{ matrix.inotify }}
        run: |
          podman info
          if [ "$RAISE_INOTIFY" = true ]; then
            sudo sysctl -w fs.inotify.max_user_instances=1280
          fi
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches

      - name: Run the original CLI suite
        env:
          OCM_FLEET_E2E_AIO_PREBUILT: "1"
          OCM_FLEET_E2E_KEEP: "1"
          LOG_LEVEL: debug
          NX_DAEMON: "false"
        run: npx nx test:e2e e2e-cli

      - name: Collect full sanitized diagnostics
        if: always()
        run: node tools/diagnose-kind.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnose-${{ matrix.name }}
          path: |
            diagnostics/
            e2e/cli/test-results/
          retention-days: 3
